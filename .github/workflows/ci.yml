name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Seconds, before any server starts: a broken test fails here, not in the browser.
      - name: Lint TWD tests
        run: npm run lint:twd

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Check prerendered HTML (SEO)
        run: npm run check:build

      - name: Start dev server
        run: |
          nohup npm run dev:ci > vite.log 2>&1 &
          npx -y wait-on http://localhost:5180/testing --timeout 60000 --interval 1000 || (cat vite.log && exit 1)
        env:
          CI: true

      - name: Run TWD tests
        uses: BRIKEV/twd-cli/.github/actions/run@v1.10.0

      - name: Display coverage
        run: npm run collect:coverage:text
